# archbtw: boot with the root filesystem served over 9p by v86.
#
# Sourced after /etc/mkinitcpio.conf, so these win over the package defaults.
#
# HOOKS must stay busybox-style (base + udev). mkinitcpio 40 defaults to the
# `systemd` hook, under which runtime hooks never run and 9p_root's
# mount_handler is silently ignored, leaving the guest unable to mount root.
# `autodetect` is also dropped: at build time it would inspect the CI runner's
# hardware and throw away the virtio and 9p modules this machine needs.
#
# A trailing `?` marks a module optional, so one that is built into this kernel
# (or folded into another, as fscache was into netfs) is not a build error.

MODULES=(atkbd? i8042? libps2? serio? serio_raw? psmouse? virtio_pci? virtio_pci_modern_dev? 9p 9pnet 9pnet_virtio fscache? netfs?)

HOOKS=(base udev modconf keyboard block filesystems 9p_root)

COMPRESSION="zstd"
