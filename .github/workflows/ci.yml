name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash -n scripts/rootfs.sh

      # The manifest must still resolve against the live archlinux32 repos.
      - run: npm run resolve

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: hashFiles('images.lock.json') != ''
        with:
          path: public/images
          key: guest-${{ hashFiles('images.lock.json') }}

      - if: hashFiles('images.lock.json') != ''
        run: npm run images

      - run: npm run build

      - if: hashFiles('images.lock.json') != ''
        run: npx playwright install --with-deps chromium

      - if: hashFiles('images.lock.json') != ''
        run: npm run test:e2e -- --project=desktop-chromium --project=android
