name: Deploy

on:
  push:
    branches: [main]
    # Nothing in these ends up on the site, and every deploy also runs the
    # whole browser matrix against it.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Until the 'Build guest' workflow has run once there is nothing to serve.
      - name: Check for a built guest
        id: guest
        run: |
          if [ -f images.lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No guest yet. Run the 'Build guest' workflow; it deploys when it finishes."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guest.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.guest.outputs.ready == 'true'
        run: npm ci

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.guest.outputs.ready == 'true'
        with:
          path: public/images
          key: guest-${{ hashFiles('images.lock.json') }}

      - if: steps.guest.outputs.ready == 'true'
        run: npm run images

      - if: steps.guest.outputs.ready == 'true'
        run: npm test

      - if: steps.guest.outputs.ready == 'true'
        run: npm run build

      # Boot the real page against the real guest before shipping it.
      - if: steps.guest.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      # The fast gate: Chromium with a keyboard and with touch. Every other
      # browser and device runs against the live site in health.yml.
      - if: steps.guest.outputs.ready == 'true'
        run: npm run test:e2e -- --project=desktop-chromium --project=android

      - name: Check the site fits GitHub Pages
        if: steps.guest.outputs.ready == 'true'
        run: |
          size_mb=$(du -sm dist | cut -f1)
          echo "dist is ${size_mb} MB"
          [ "$size_mb" -le 1000 ] || { echo "::error::dist is ${size_mb} MB; GitHub Pages allows 1 GB"; exit 1; }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.guest.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.guest.outputs.ready == 'true'
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.guest.outputs.ready == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
